<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeOff - Deepfake Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .upload-container {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .result-container {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">FakeOff - Deepfake Detection</h1>
        
        <div class="upload-container">
            <h4>Upload an image to detect if it's a deepfake</h4>
            <p class="text-muted">Supported formats: JPG, JPEG, PNG</p>
            
            <form id="upload-form" enctype="multipart/form-data">
                <div class="mb-3">
                    <input class="form-control" type="file" id="image-upload" name="image" accept="image/jpeg,image/png,image/jpg">
                </div>
                
                <img id="image-preview" class="image-preview" src="#" alt="Preview">
                
                <button type="submit" class="btn btn-primary mt-3">Analyze Image</button>
            </form>
            
            <div id="loader" class="loader"></div>
        </div>
        
        <div id="result-container" class="result-container">
            <h4>Analysis Result</h4>
            <div id="result-content">
                <!-- Results will be displayed here -->
            </div>
        </div>
    </div>

    <script>
        // Image preview functionality
        document.getElementById('image-upload').addEventListener('change', function(event) {
            const preview = document.getElementById('image-preview');
            const file = event.target.files[0];
            
            if (file) {
                preview.style.display = 'block';
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.src = e.target.result;
                }
                
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
                preview.src = '#';
            }
        });
        
        // Form submission
        document.getElementById('upload-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');
            
            // Show loading spinner
            loader.style.display = 'block';
            resultContainer.style.display = 'none';
            
            // Send request to backend
            fetch('/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // Hide loader
                loader.style.display = 'none';
                
                // Display results
                resultContainer.style.display = 'block';
                
                if (data.is_deepfake) {
                    resultContent.innerHTML = `
                        <div class="alert alert-danger">
                            <h5>⚠️ Deepfake Detected</h5>
                            <p>This image appears to be artificially generated with ${data.confidence}% confidence.</p>
                        </div>
                    `;
                } else {
                    resultContent.innerHTML = `
                        <div class="alert alert-success">
                            <h5>✅ Authentic Image</h5>
                            <p>This image appears to be authentic with ${data.confidence}% confidence.</p>
                        </div>
                    `;
                }
                
                // Add additional details if provided by backend
                if (data.details) {
                    resultContent.innerHTML += `<div class="mt-3"><h6>Additional Details:</h6><p>${data.details}</p></div>`;
                }
            })
            .catch(error => {
                loader.style.display = 'none';
                resultContainer.style.display = 'block';
                resultContent.innerHTML = `
                    <div class="alert alert-warning">
                        <h5>Error During Analysis</h5>
                        <p>An error occurred: ${error.message}</p>
                    </div>
                `;
            });
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
